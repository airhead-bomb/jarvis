<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>자비스 로그인</title>
<style>
  :root { --bg:#0f1115; --surface:#1a1d24; --accent:#00d2b4; --text:#eef1f4; --text-dim:#8a8f98; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Pretendard","Apple SD Gothic Neo",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; }
  form { width:100%; max-width:320px; padding:24px; display:flex; flex-direction:column; gap:12px; }
  h1 { text-align:center; font-size:20px; margin-bottom:8px; }
  input { padding:12px 14px; border-radius:12px; border:1px solid #2a2f38;
    background:var(--surface); color:var(--text); font-size:15px; outline:none; }
  button { padding:12px; border-radius:12px; border:none; background:var(--accent);
    color:#08201c; font-size:15px; font-weight:600; }
  .error { color:#ff6b6b; font-size:13px; text-align:center; min-height:18px; }
</style>
</head>
<body>
<form method="POST" action="/login">
  <h1>🤖 자비스</h1>
  <input type="text" name="username" placeholder="아이디" autocomplete="username" required />
  <input type="password" name="password" placeholder="비밀번호" autocomplete="current-password" required />
  <div class="error">__ERROR__</div>
  <button type="submit">로그인</button>
</form>
</body>
</html>
