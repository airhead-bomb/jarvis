<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>자비스</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/static/icon.png" />
<meta name="theme-color" content="#0f1115" />
<style>
  :root {
    --bg: #0f1115;
    --surface: #1a1d24;
    --accent: #00d2b4;
    --text: #eef1f4;
    --text-dim: #8a8f98;
    --bubble-user: #2a3038;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", Roboto, sans-serif;
  }
  #app {
    display: flex; flex-direction: column;
    height: 100vh; max-width: 600px; margin: 0 auto;
  }
  header {
    padding: env(safe-area-inset-top, 16px) 20px 14px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid #22262e;
  }
  header .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent);
  }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; }
  header .sub { font-size: 12px; color: var(--text-dim); margin-left: auto; }

  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 78%; padding: 10px 14px; border-radius: 16px;
    line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.jarvis {
    background: var(--surface); align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.user {
    background: var(--bubble-user); align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg.thinking { color: var(--text-dim); font-style: italic; }

  #inputbar {
    display: flex; gap: 8px; padding: 12px 16px calc(env(safe-area-inset-bottom, 12px) + 8px);
    border-top: 1px solid #22262e; background: var(--bg);
  }
  #inputbar input {
    flex: 1; border-radius: 22px; border: 1px solid #2a2f38;
    background: var(--surface); color: var(--text);
    padding: 12px 16px; font-size: 15px; outline: none;
  }
  #inputbar button {
    width: 46px; height: 46px; border-radius: 50%; border: none;
    background: var(--accent); color: #08201c; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  #inputbar button:active { transform: scale(0.95); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="dot"></div>
    <h1>자비스</h1>
    <div class="sub">Gemini 3.6 Flash</div>
  </header>
  <div id="messages"></div>
  <div id="inputbar">
    <input id="input" type="text" placeholder="자비스에게 말해보세요..." autocomplete="off" />
    <button id="send">➤</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  // 이 폰(브라우저)만의 세션 id를 만들어서 서버 쪽 대화 기억을 구분함
  let sessionId = localStorage.getItem('jarvis_session_id');
  if (!sessionId) {
    sessionId = 'web-' + Math.random().toString(36).slice(2);
    localStorage.setItem('jarvis_session_id', sessionId);
  }

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  addMessage('jarvis', '자비스 온라인. 무엇을 도와드릴까요?');

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    addMessage('user', text);

    const thinking = addMessage('jarvis thinking', '생각 중...');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      if (res.status === 401) {
        window.location.href = '/login';
        return;
      }
      const data = await res.json();
      thinking.textContent = data.reply;
      thinking.classList.remove('thinking');
    } catch (e) {
      thinking.textContent = '오류가 발생했어요: ' + e.message;
      thinking.classList.remove('thinking');
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
</body>
</html>
